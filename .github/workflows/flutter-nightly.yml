name: Flutter Nightly Build

# The upstream nightly cron is deliberately gone. This repo is private, so every
# minute is billed against the account allowance, and a full matrix costs more
# than a month of it in a single run. Builds are dispatched by hand.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated targets: windows,macos,linux,android,ios,sciter,linux-drm,appimage,flatpak"
        type: string
        default: "windows,macos,linux"

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      platforms: ${{ inputs.platforms }}
